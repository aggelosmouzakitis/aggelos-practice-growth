# practice.aggelosmouzakitis.com: a separate Netlify project from the
# psychotherapy site (aggelosmouzakitis.com, repo aggelosmouzakitispersonal).
#
# The build is scripts/build.mjs: Node built-ins only, no npm dependencies. It
# writes dist/ (also committed, so a drag-and-drop or CLI deploy of dist/ works
# as-is). Only the production context is indexable; deploy previews, branch
# deploys and `netlify dev` get noindex in the HTML and an X-Robots-Tag header
# on every file (dist/_headers, written by the build for those contexts only).
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Security ─────────────────────────────────────────────────────────────────
# The full Content-Security-Policy is a <meta> in each page, generated by the
# build with the hashes of the inline style and script. A meta CSP cannot set
# frame-ancestors, so that one directive is sent here as a header.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ── Caching ──────────────────────────────────────────────────────────────────
# Images and scripts carry a content hash in their file names (the build adds
# it), and font file names carry their version, so all three can be cached for
# a year. HTML keeps Netlify's default (always revalidated), so a deploy shows
# at once.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fixed names (icons, the social preview image, robots.txt, sitemap.xml): one day.
[[headers]]
  for = "/social/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
